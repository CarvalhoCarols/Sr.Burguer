<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="container-produto">
    <div class="produto-card">


    <h3>🥟Patel de Carne</h3>
        <img src="Imagens/pastel-carne.png" alt="Sr-Bacon">
    <p>
        Massa folhada, carne patinho, catupiry.
        
    </p>

    <span class="preco">R$ 22,90</span>

   <button class="boot" onclick="adicionarProduto('Pastel de Carne', 22.90)">
    Adicionar
</button>

</div>
</div>
    <div class="produto-card">
    <h3>🥟Pastel de Frango</h3>
    <img src="Imagens/pastel-frango.jpg" alt="Sr-Bacon">
    <p>
        Massa folhada, frango desfiano, catupiry.
    </p>
    <span class="preco">R$ 40,90</span>
     <button class="boot" onclick="adicionarProduto('Pastel de Frango', 22.90)">
    Adicionar
</button>
</div>
    <div class="produto-card">
    <h3>🥟Pastel de Calabresa</h3>
    <img src="Imagens/PASTEL-CALABRESA.png" alt="Sr-Bacon">
    <p>
        Massa folhada, calabresa desfiada, catupiry.
    </p>
    <span class="preco">R$ 31,90</span>
      <button class="boot" onclick="adicionarProduto('Pastel de Calabresa', 22.90)">
    Adicionar
</button>
</div>
</section>
<!--CARRINHO DE COMPRAS-->
    <aside id="carrinho">
    
    <h2>🛒 Carrinho</h2>

    <p id="contador">Itens: 0</p>

    <ul id="lista-carrinho"></ul>

    <h3 id="total">Total: R$ 0,00</h3>
    </aside>


<!-- FUNCAO DE FINALIZAR/LIMPAR  -->
    <aside class="finalizarPedido">
        <button class="boot" onclick="finalizarPedido()">
    📱 Finalizar Pedido
</button>
    <button class="boot" onclick="limparCarrinho()">
    🗑️ Limpar Carrinho
</button>
    
<div class="dados-cliente">
    <input class="entrega" type="text" id="nomeCliente" placeholder="Seu nome">

    <input class="entrega" type="text" id="endereco" placeholder="Seu endereço">

    <select id="pagamento">
        <option>Pix</option>
        <option>Dinheiro</option>
        <option>Cartão</option>
    </select>
</div>
    </aside>
        
    

</body>
<script src="JavaS/Script.js">
</script>
</html>
