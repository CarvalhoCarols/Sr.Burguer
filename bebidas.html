<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebidas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
   <!-- PRODUTOS DO CARDAPIO -->
    <section class="container-produto">
    <div class="produto-card">


    <h3>🥤Refrigerantes</h3>
        <img src="Imagens/REFRI.png" alt="Sr-Bacon">
    <p>
        Coca-cola lata, Fanta lata, Sprite lata.    
    </p>

    <span class="preco">
        <p>R$ 8.50</p>
    </span>
        <button class="boot" onclick="adicionarProduto('Refrigerante', 8.50)">
    Adicionar
</button>
</div>
</div>
    <div class="produto-card">
    <h3>💧Agua Mineral</h3>
    <img src="Imagens/agua.png" alt="Sr-Bacon">
    <p>
        Agua mineral 500ml
    </p>
    <span class="preco">R$ 4.50</span>
      <button class="boot" onclick="adicionarProduto('Agua', 4.50)">
    Adicionar
</button>
</div>
    <div class="produto-card">
    <h3> 🧃Suco Natual</h3>
    <img src="Imagens/sucos.png" alt="Sr-Bacon">
    <p>
       Suco de Laranja, Manga, Morango, etc...
       Jarra 1L 
    </p>
    <span class="preco">R$ 10.80</span>
      <button class="boot" onclick="adicionarProduto('Suco', 10.80)">
    Adicionar
</button>
        </div>
</div>
</section>

<!--CARRINHO DE COMPRAS-->
    <aside id="carrinho">
    
    <h2>🛒 Carrinho</h2>

    <p id="contador">Itens: 0</p>

    <ul id="lista-carrinho"></ul>

    <h3 id="total">Total: R$ 0,00</h3>
    </aside>
  

<!-- FUNCAO DE FINALIZAR/LIMPAR  -->
    <aside class="finalizarPedido">
        <button class="boot" onclick="finalizarPedido()">
    📱 Finalizar Pedido
</button>
    <button class="boot" onclick="limparCarrinho()">
    🗑️ Limpar Carrinho
</button>
    
<input
type="text"
id="nomeCliente"
placeholder="Seu nome">

<input
type="text"
id="endereco"
placeholder="Seu endereço">

<select id="pagamento">
    <option>Pix</option>
    <option>Dinheiro</option>
    <option>Cartão</option>
</select>

    </aside>
        
    

</body>
<script src="JavaS/script.js">
</script>
</html>
